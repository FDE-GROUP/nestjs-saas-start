name: Deploy API Documentation (Swagger + TypeDoc + RepoWiki)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'openapi/**'
      - '.qoder/repowiki/**'
      - 'typedoc.json'
      - 'tsconfig.doc.json'
      - 'tsconfig*.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-swagger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # App Environment
      NODE_ENV: ${{ vars.NODE_ENV || 'development' }}
      API_DOC_VERSION: ${{ vars.API_DOC_VERSION || '1.0.0' }}
      PORT: ${{ vars.PORT || '7009' }}
      HOST: ${{ vars.HOST || 'localhost' }}
      API_PREFIX: ${{ vars.API_PREFIX || 'api' }}
      APP_NAME: ${{ vars.APP_NAME || 'NestJS SaaS Start' }}
      APP_DESCRIPTION: ${{ vars.APP_DESCRIPTION || 'NestJS template with best practices' }}
      API_VERSION: ${{ vars.API_VERSION || '1.0' }}
      OPEN_API_VERSION: ${{ vars.OPEN_API_VERSION || '3.1.0' }}

      # Database（codegen 不连库，仅需通过 zod 的 postgres|postgresql scheme 校验；
      # 旧值 mongodb:// 为 Prisma 时代古董，迁 MikroORM+PG 后一直卡死本 workflow）
      DATABASE_URL: ${{ vars.DATABASE_URL || 'postgres://swagger:swagger@localhost:5432/swagger' }}

      # Auth
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || 'localhost:*,127.0.0.1,localhost:7009,*:7009' }}
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'dummy-jwt-secret-for-swagger-generation' }}
      JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN || '30d' }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'dummy-jwt-refresh-secret-for-swagger-generation' }}
      JWT_REFRESH_EXPIRES_IN: ${{ vars.JWT_REFRESH_EXPIRES_IN || '90d' }}

      # Storage
      STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 's3' }}
      STORAGE_BUCKET: ${{ vars.STORAGE_BUCKET || 'my-bucket' }}
      STORAGE_REGION: ${{ vars.STORAGE_REGION || 'us-east-1' }}
      STORAGE_ENDPOINT: ${{ vars.STORAGE_ENDPOINT || 's3.us-east-1.amazonaws.com' }}
      STORAGE_ACCESS_KEY_ID: ${{ secrets.STORAGE_ACCESS_KEY_ID || 'dummy-access-key-id' }}
      STORAGE_ACCESS_KEY_SECRET: ${{ secrets.STORAGE_ACCESS_KEY_SECRET || 'dummy-access-key-secret' }}
      STORAGE_BASE_URL: ${{ vars.STORAGE_BASE_URL || 'https://my-bucket.s3.us-east-1.amazonaws.com' }}
      STORAGE_MAX_FILE_SIZE: ${{ vars.STORAGE_MAX_FILE_SIZE || '10485760' }}
      STORAGE_ALLOWED_MIME_TYPES: ${{ vars.STORAGE_ALLOWED_MIME_TYPES || 'image/jpeg,image/png,image/gif,application/pdf' }}

      # Datadog
      DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY || 'dummy-datadog-api-key' }}
      DATADOG_SERVICE_NAME: ${{ vars.DATADOG_SERVICE_NAME || 'nestjs-structure-practices' }}
      DATADOG_HOST_NAME: ${{ vars.DATADOG_HOST_NAME || 'local-dev' }}
      DATADOG_INTAKE_REGION: ${{ vars.DATADOG_INTAKE_REGION || 'us5' }}

      # Stripe
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_dummy_secret_key' }}
      STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY || 'pk_test_dummy_public_key' }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET || 'whsec_dummy_webhook_secret' }}
      STRIPE_API_VERSION: ${{ vars.STRIPE_API_VERSION || '2025-02-24.acacia' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # 版本由 package.json 的 packageManager 字段（pnpm@11.7.0）供给，无需在此写死

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Swagger + TypeDoc into combined site/
        run: |
          set -euo pipefail

          # ---- 1) Swagger / OpenAPI（DB-free codegen·就绪首切片 #4）----
          # 不启服务直接整树装配导出 spec（替代旧「起服务 + sleep 15 + curl」hack；
          # 与运行态导出字节级一致）。产物落子目录 site/swagger/。
          pnpm run openapi:export
          mkdir -p site/swagger
          cp openapi/openapi.yaml site/swagger/swagger.yaml

          cat > site/swagger/index.html << 'SWAGGER_EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <title>NestJS API Documentation (Swagger)</title>
            <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
            <style>
              html { box-sizing: border-box; overflow: -moz-scrollbars-vertical; overflow-y: scroll; }
              *, *:before, *:after { box-sizing: inherit; }
              body { margin: 0; background: #fafafa; }
              .topbar { display: none; }
              .swagger-ui .info { margin: 30px 0; }
              .swagger-ui .info .title { font-size: 32px; }
              .swagger-ui .info .description { font-size: 16px; line-height: 1.5; }
            </style>
          </head>
          <body>
            <div id="swagger-ui"></div>
            <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
            <script>
              window.onload = function() {
                window.ui = SwaggerUIBundle({
                  url: "./swagger.yaml",
                  dom_id: '#swagger-ui',
                  deepLinking: true,
                  presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIBundle.SwaggerUIStandalonePreset
                  ],
                  layout: "BaseLayout",
                  supportedSubmitMethods: ['get', 'post', 'put', 'delete', 'patch'],
                });
              };
            </script>
          </body>
          </html>
          SWAGGER_EOF

          # ---- 2) TypeDoc 公共 API 参考（tsdoc-typedoc-docgen 切片 F·ⓕ=乙）----
          # 读根 typedoc.json（纳 @saas/contracts + @core/saas-kit + apps/api 对外接口·
          # excludeNotDocumented 只文档化已注释件）→ 产 api-docs/ → 落子目录 site/tsdoc/。
          pnpm run docs:api
          mkdir -p site/tsdoc
          cp -r api-docs/. site/tsdoc/

          # ---- 3) RepoWiki 代码库百科（.qoder/repowiki·Docsify 免构建运行时渲染）----
          # 整树提交进仓的 IDE 生成 wiki（zh/content 文档树 + knowledge 知识卡）。
          # Docsify 无需构建步：把 md 原样拷入子站，index.html 运行时按需渲染，
          # 侧边栏 _sidebar.md 由无依赖 Node 脚本按当前文件树现场生成（始终与提交同步）。
          mkdir -p site/repowiki
          cp -r .qoder/repowiki/zh/. site/repowiki/zh/
          cp -r .qoder/repowiki/knowledge/. site/repowiki/knowledge/

          cat > gen-repowiki-sidebar.mjs << 'REPOWIKI_SIDEBAR_EOF'
          import { readdirSync, statSync, writeFileSync } from 'node:fs';
          import { join, relative } from 'node:path';
          const root = process.argv[2];
          const out = process.argv[3];
          const enc = (rel) => rel.split('/').map(encodeURIComponent).join('/');
          function walk(dir, depth) {
            const ind = '  '.repeat(depth);
            let lines = [];
            const entries = readdirSync(dir).sort((a, b) => {
              const da = statSync(join(dir, a)).isDirectory();
              const db = statSync(join(dir, b)).isDirectory();
              if (da !== db) return da ? -1 : 1; // 目录优先
              return a.localeCompare(b, 'zh');
            });
            for (const name of entries) {
              const full = join(dir, name);
              if (statSync(full).isDirectory()) {
                lines.push(`${ind}- **${name}**`);
                lines = lines.concat(walk(full, depth + 1));
              } else if (name.endsWith('.md')) {
                const rel = relative(root, full).replace(/\\/g, '/');
                lines.push(`${ind}- [${name.replace(/\.md$/, '')}](<${enc(rel)}>)`);
              }
            }
            return lines;
          }
          writeFileSync(out, walk(root, 0).join('\n') + '\n', 'utf8');
          REPOWIKI_SIDEBAR_EOF
          node gen-repowiki-sidebar.mjs site/repowiki site/repowiki/_sidebar.md

          cat > site/repowiki/index.html << 'REPOWIKI_EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>NestJS SaaS Start · RepoWiki</title>
            <link rel="stylesheet" href="https://unpkg.com/docsify@4/lib/themes/vue.css">
          </head>
          <body>
            <div id="app"></div>
            <script src="https://unpkg.com/mermaid@10/dist/mermaid.min.js"></script>
            <script>
              if (window.mermaid) window.mermaid.initialize({ startOnLoad: false, securityLevel: 'loose' });
              // Docsify(marked) 把 ```mermaid 渲染成 <pre data-lang="mermaid"><code class="lang-mermaid">，
              // 类名前缀随版本变（lang- / language-），故三类选择器并集→ 改写为 <div class="mermaid"> 交给 mermaid.run 就地绘制。
              var MERMAID_CODE_SEL = 'pre > code.language-mermaid, pre > code.lang-mermaid, pre[data-lang="mermaid"] > code';
              function renderMermaid() {
                if (!window.mermaid) return;
                var pending = document.querySelectorAll(MERMAID_CODE_SEL);
                var unprocessed = document.querySelectorAll('.markdown-section .mermaid:not([data-processed])');
                if (!pending.length && !unprocessed.length) return; // 幂等守卫·防 MutationObserver 回环
                pending.forEach(function (codeEl) {
                  var div = document.createElement('div');
                  div.className = 'mermaid';
                  div.textContent = codeEl.textContent;
                  codeEl.parentElement.replaceWith(div);
                });
                try { window.mermaid.run({ querySelector: '.markdown-section .mermaid' }); } catch (e) { console.error(e); }
              }
              window.$docsify = {
                name: 'RepoWiki',
                loadSidebar: true,
                homepage: 'zh/content/项目概览.md',
                alias: { '/.*/_sidebar.md': '/_sidebar.md' },
                subMaxLevel: 3,
                sidebarDisplayLevel: 1,
                search: { placeholder: '搜索', noData: '无结果', depth: 6 },
                hooks: { doneEach: function () { renderMermaid(); } },
              };
            </script>
            <script src="https://unpkg.com/docsify@4/lib/docsify.min.js"></script>
            <script src="https://unpkg.com/docsify@4/lib/plugins/search.min.js"></script>
            <script src="https://unpkg.com/docsify-sidebar-collapse@1/dist/docsify-sidebar-collapse.min.js"></script>
            <script>
              // 不依赖 Docsify doneEach 的触发时机（某些版本与代码块注入时序不同步）：
              // load 后监听 #app 子树变化·带防抖兼幂等守卫兼底渲染新注入的 mermaid。
              window.addEventListener('load', function () {
                var app = document.getElementById('app');
                if (!app || typeof MutationObserver === 'undefined') return;
                var timer;
                new MutationObserver(function () {
                  clearTimeout(timer);
                  timer = setTimeout(renderMermaid, 60);
                }).observe(app, { childList: true, subtree: true });
                renderMermaid();
              });
            </script>
          </body>
          </html>
          REPOWIKI_EOF

          # ---- 4) 根落地页（链三子站·消解 peaceiris 整分支替换的双 deploy 互踩）----
          cat > site/index.html << 'LANDING_EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>NestJS SaaS Start · API 文档</title>
            <style>
              :root { color-scheme: light dark; }
              * { box-sizing: border-box; }
              body {
                margin: 0; min-height: 100vh; display: grid; place-items: center;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
                background: #0f172a; color: #e2e8f0;
              }
              .wrap { max-width: 720px; padding: 48px 24px; text-align: center; }
              h1 { font-size: 28px; margin: 0 0 8px; }
              p.lead { color: #94a3b8; margin: 0 0 36px; }
              .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
              @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
              a.card {
                display: block; padding: 28px 20px; border-radius: 14px; text-decoration: none;
                background: #1e293b; border: 1px solid #334155; color: #e2e8f0; transition: .15s;
              }
              a.card:hover { border-color: #38bdf8; transform: translateY(-2px); }
              a.card h2 { margin: 0 0 6px; font-size: 20px; }
              a.card span { color: #94a3b8; font-size: 14px; }
              footer { margin-top: 36px; color: #64748b; font-size: 12px; }
            </style>
          </head>
          <body>
            <div class="wrap">
              <h1>NestJS SaaS Start · API 文档</h1>
              <p class="lead">选择要查看的文档面（由 CI 自动构建 · 勿手工改动）。</p>
              <div class="cards">
                <a class="card" href="./swagger/">
                  <h2>Swagger / OpenAPI</h2>
                  <span>HTTP 接口契约（端点 · 请求 / 响应 schema）</span>
                </a>
                <a class="card" href="./tsdoc/">
                  <h2>公共 API 参考（TypeDoc）</h2>
                  <span>contracts + core + apps/api 对外接口 TSDoc</span>
                </a>
                <a class="card" href="./repowiki/">
                  <h2>RepoWiki（代码库百科）</h2>
                  <span>架构 / 多租户 / 认证 / 部署 等模块 Wiki + 知识卡</span>
                </a>
              </div>
              <footer>Generated by GitHub Actions · Swagger + TypeDoc + RepoWiki · single combined deploy</footer>
            </div>
          </body>
          </html>
          LANDING_EOF

      - name: Deploy combined site to GitHub Pages
        id: deployment
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: update API documentation (swagger + tsdoc)'
