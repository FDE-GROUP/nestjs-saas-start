[options]
; all-in-one demo 用 Odoo 配置（非生产）。addons 含官方路径 + 插件落点 /mnt/extra-addons。
db_host = 127.0.0.1
db_port = 5432
db_user = odoo
db_password =
dbfilter = ^odoo-demo$
http_port = 8069
; 绑所有网卡：all-in-one 容器内需让宿主 -p 8069 发布端口可达（默认绑 127.0.0.1 会被 docker 端口转发隔在 loopback 外）。
http_interface = 0.0.0.0
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/usr/lib/python3/dist-packages/addons,/mnt/extra-addons
; demo 定位·DB 管理器口令占位（非真实凭证）
admin_passwd = demo-admin-not-for-prod
list_db = True
