                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaymentCheckoutRefResponse'
        '404':
          description: Checkout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Retrieve a checkout
      tags: *ref_14
  /api/v1/payment/refunds:
    post:
      operationId: PaymentController_refund_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checkoutId:
                  type: string
                  minLength: 1
                  maxLength: 128
                amount:
                  type: number
                  minimum: 1
                reason:
                  type: string
                  maxLength: 20000
              required:
                - checkoutId
              additionalProperties: false
      responses:
        '201':
          description: Refund created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaymentRefundRefResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Refund a checkout
      tags: *ref_14
  /api/v1/payment/webhooks:
    post:
      operationId: PaymentController_handleWebhook_v1
      parameters:
        - name: stripe-signature
          required: true
          in: header
          description: Payment provider webhook signature
          schema:
            type: string
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WebhookAckResponse'
        '400':
          description: Invalid webhook signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Handle payment webhook events
      tags: *ref_14
info:
  title: NestJS SaaS Start API
  description: NestJS SaaS Start API documentation
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ApiEnvelope:
      type: object
      properties:
        statusCode:
          type: number
          description: HTTP 状态码回显（响应体字段，非状态码本身）。
        message:
          type: string
          description: 人面可读消息（成功面恒 "Success"）。
        data:
          type: object
          description: 业务载荷；具体形状见 allOf 第二项的 $ref。
          additionalProperties: true
      required:
        - statusCode
        - message
        - data
    ApiErrorDetail:
      type: object
      properties:
        path:
          type: string
          description: 字段路径（校验失败 = property；业务失败可缺省）。
        code:
          type: string
          description: 细分机器码（业务子错误给；校验面留空）。
        message:
          type: string
          description: 人面可读（随 i18n 译文）。
      required:
        - message
    ApiErrorResponse:
      type: object
      properties:
        statusCode:
          type: number
          description: HTTP 状态码。
        message:
          description: 人面可读消息；校验失败时为逐字段消息数组。
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
          description: HTTP 类别名（如 "Not Found"）。
        timestamp:
          type: string
          format: date-time
          description: 服务端时刻 ISO 串。
        path:
          type: string
          description: 请求路径。
        requestId:
          type: string
          description: 请求关联 id（与 x-request-id 头、日志、领域事件 correlationId 同源）。
        errorCode:
          type: string
          description: >-
            业务错误码（`NAMESPACE:NAME` 冒号文法·单源 = @core ERROR_CODES，前端据 code 分支、据
            message 展示）。
        errors:
          description: 字段级结构化明细。
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorDetail'
      required:
        - statusCode
        - message
        - error
        - timestamp
        - path
        - requestId
    OrganizationRoleViewResponse:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7。
        key:
          type: string
          description: 角色 key（组织内唯一）。
        name:
          type: string
          description: 人面可读名。
        isSystem:
          type: boolean
          description: 系统内置角色（不可改名/删除）。
      required:
        - id
        - key
        - name
        - isSystem
    OrganizationRoleGrantViewResponse:
      type: object
      properties:
        subject:
          type: string
          enum:
            - Organization
            - Member
            - Invitation
            - Workspace
            - Role
            - RoleGrant
          description: 授权主体词汇。
        action:
          type: string
          enum:
            - create
            - read
            - update
            - delete
            - cancel
          description: 动作词汇。
        conditions:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: CASL 条件（白名单字段）；null = 无约束。
      required:
        - subject
        - action
        - conditions
    PlatformTenantRowResponse:
      type: object
      properties:
        organizationId:
          type: string
          description: organization 主键（= 租户 id）。
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: &ref_15
            - pending_approval
            - active
            - suspended
            - deleted
          description: 生命周期状态（无记录视同 active）。
        createdAt:
          format: date-time
          type: string
      required:
        - organizationId
        - name
        - slug
        - status
        - createdAt
    PlatformTenantPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformTenantRowResponse'
        total:
          type: number
          description: 全量行数。
        limit:
          type: number
          description: 回显页宽。
        offset:
          type: number
          description: 回显偏移。
      required:
        - items
        - total
        - limit
        - offset
    TenantDiagnosticsResponse:
      type: object
      properties:
        tenant:
          description: 租户行。
          allOf:
            - $ref: '#/components/schemas/PlatformTenantRowResponse'
        memberCount:
          type: number
          description: 成员数。
        invitationCount:
          type: number
          description: 待处理邀请数。
        workspaceCount:
          type: number
          description: 工作区数。
        postCount:
          type: number
          description: 帖子数。
      required:
        - tenant
        - memberCount
        - invitationCount
        - workspaceCount
        - postCount
    TenantHardDeleteResultResponse:
      type: object
      properties:
        organizationId:
          type: string
          description: 被硬删的 organization 主键。
        purgedEvents:
          type: number
          description: 本次清除的 lifecycle 事件数（供审计核对）。
      required:
        - organizationId
        - purgedEvents
    TenantApplicationResponse:
      type: object
      properties:
        organizationId:
          type: string
          description: organization 主键（= 租户 id）。
        status:
          type: string
          enum:
            - pending_approval
            - active
            - suspended
            - deleted
          description: 生命周期状态。
      required:
        - organizationId
        - status
    PlatformUserRowResponse:
      type: object
      properties:
        userId:
          type: string
          description: 用户主键。
        name:
          type: string
        email:
          type: string
        status:
          type: string
          enum: *ref_15
          description: 治理状态（无记录视同 active）。
        createdAt:
          format: date-time
          type: string
      required:
        - userId
        - name
        - email
        - status
        - createdAt
    PlatformUserPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformUserRowResponse'
        total:
          type: number
          description: 全量行数。
        limit:
          type: number
          description: 回显页宽。
        offset:
          type: number
          description: 回显偏移。
      required:
        - items
        - total
        - limit
        - offset
    UserGovernanceResultResponse:
      type: object
      properties:
        userId:
          type: string
          description: 用户主键。
        status:
          type: string
          enum: *ref_15
          description: 迁移后的新状态。
      required:
        - userId
        - status
    PostResponse:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7。
        title:
          type: string
        content:
          type:
            - string
            - 'null'
        published:
          type: boolean
        organizationId:
          type: string
          description: 所属租户（ALS 盖章，body 不接受）。
        workspaceId:
          type:
            - string
            - 'null'
          description: 所属工作区；NULL = 未分区。
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - title
        - content
        - published
        - organizationId
        - workspaceId
        - createdAt
        - updatedAt
    PostCursorPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostResponse'
        hasMore:
          type: boolean
          description: 是否还有下一页。
        nextCursor:
          type: string
          description: 不透明游标（hasMore=false 时缺省）。
      required:
        - items
        - hasMore
    WorkspaceResponse:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7。
        name:
          type: string
        slug:
          type: string
        organizationId:
          type: string
          description: 所属租户（仓储盖章）。
        ownerId:
          type:
            - string
            - 'null'
          description: 实例属主；NULL/缺省 = 不属任何人（owner-column 片语义）。
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - slug
        - organizationId
        - createdAt
        - updatedAt
    WorkspacePageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceResponse'
        total:
          type: number
          description: 全量行数。
        limit:
          type: number
          description: 回显页宽。
        offset:
          type: number
          description: 回显偏移。
      required:
        - items
        - total
        - limit
        - offset
    SubscriptionResponse:
      type: object
      properties:
        hasSubscription:
          type: boolean
          description: 是否已有生效订阅。
        plan:
          type: string
          description: 生效档位 plan key（缺订阅回落 FREE_PLAN）。
        seatsLimit:
          type: number
          description: 座位上限。
        used:
          type: number
          description: 已用座位（= 成员数·实时算）。
        remaining:
          type: number
          description: 剩余座位。
        providerCustomerId:
          type:
            - string
            - 'null'
          description: 支付通道 customer id；无订阅 = null。
      required:
        - hasSubscription
        - plan
        - seatsLimit
        - used
        - remaining
        - providerCustomerId
    FileUploadResultDto:
      type: object
      properties:
        key:
          type: string
          description: File unique identifier
        url:
          type: string
          description: File access URL
        etag:
          type: string
          description: File ETag value
        size:
          type: number
          description: File size (bytes)
        mimetype:
          type: string
          description: File MIME type
        originalname:
          type: string
          description: Original filename
      required:
        - key
        - url
        - size
        - mimetype
        - originalname
    StorageDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 删除是否成功。
      required:
        - success
    StorageUrlResponse:
      type: object
      properties:
        url:
          type: string
          description: 签名访问 URL。
      required:
        - url
    PaymentStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
          description: 集成状态恒 "ok"。
        selected:
          type: string
          enum: &ref_16
            - stripe
            - alipay
            - wechat_pay
          description: 当前选定通道。
        available:
          type: array
          description: 可用通道集合。
          items:
            type: string
            enum: *ref_16
      required:
        - status
        - selected
        - available
    PaymentCustomerRefResponse:
      type: object
      properties:
        id:
          type: string
          description: 通道侧 customer id。
        providerId:
          type: string
          enum: *ref_16
          description: 所属通道。
        email:
          type: string
        raw:
          type: object
          additionalProperties: true
          description: 通道原生载荷透传。
      required:
        - id
        - providerId
        - email
        - raw
    PaymentCheckoutRefResponse:
      type: object
      properties:
        id:
          type: string
          description: checkout / payment intent id。
        providerId:
          type: string
          enum: *ref_16
          description: 所属通道。
        status:
          type: string
          description: 通道侧状态串。
        clientSecret:
          type: string
          description: 客户端密钥（前端确认支付用）。
        raw:
          type: object
          additionalProperties: true
          description: 通道原生载荷透传。
      required:
        - id
        - providerId
        - raw
    PaymentRefundRefResponse:
      type: object
      properties:
        id:
          type: string
          description: refund id。
        providerId:
          type: string
          enum: *ref_16
          description: 所属通道。
        status:
          type: string
          description: 通道侧状态串。
        amount:
          type: number
          description: 退款金额（最小货币单位）。
        raw:
          type: object
          additionalProperties: true
          description: 通道原生载荷透传。
      required:
        - id
        - providerId
        - raw
    WebhookAckResponse:
      type: object
      properties:
        received:
          type: boolean
          description: 回调是否已接收处理。
      required:
        - received
