        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: List grant rows of a role (echo checked state)
      tags: *ref_3
    post:
      operationId: AuthorizationAdminController_grant_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleKey:
                  type: string
                  minLength: 1
                  maxLength: 128
                subject:
                  type: string
                  enum:
                    - Organization
                    - Member
                    - Invitation
                    - Workspace
                    - Role
                    - RoleGrant
                action:
                  type: string
                  enum:
                    - create
                    - read
                    - update
                    - delete
                    - cancel
                conditions:
                  type: object
                  additionalProperties: {}
              required:
                - roleKey
                - subject
                - action
              additionalProperties: false
      responses:
        '200':
          description: Granted.
        '400':
          description: Invalid conditions (whitelist-only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Duplicate grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Grant a permission cell to a role (multi-condition rows = OR union)
      tags: *ref_3
