openapi: 3.1.0
paths:
  /api/v1/health:
    get:
      operationId: HealthController_check_v1
      parameters: []
      responses:
        '200':
          description: |-
            Service is alive（透传面·形参真相源 = @nestjs/terminus HealthCheckResult）

            The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                    example: ok
                  info:
                    type:
                      - object
                      - 'null'
                    example: &ref_0
                      database:
                        status: up
                        responseTime: 12
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                  error:
                    type:
                      - object
                      - 'null'
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                  details:
                    type: object
                    example: *ref_0
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
        '503':
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                      - shutting_down
                    example: error
                  info:
                    type:
                      - object
                      - 'null'
                    example:
                      database: &ref_1
                        status: up
                        responseTime: 12
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                  error:
                    type:
                      - object
                      - 'null'
                    example:
                      redis: &ref_2
                        status: down
                        message: Could not connect
                        responseTime: 3005
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                  details:
                    type: object
                    example:
                      database: *ref_1
                      redis: *ref_2
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
      summary: Liveness probe (ping-only, no dependency checks)
      tags:
        - Health
  /api/v1/tenants/roles:
    get:
      operationId: AuthorizationAdminController_listRoles_v1
      parameters: []
