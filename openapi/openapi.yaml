  /api/v1/tenants/roles/grants:
    get:
      operationId: AuthorizationAdminController_listGrants_v1
      parameters:
        - name: roleKey
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Grant views (subject/action/conditions).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
