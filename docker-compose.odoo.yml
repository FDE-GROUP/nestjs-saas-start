# 本仓内置 Odoo 20 社区版（CE）联调栈 —— 独立 opt-in·与 OdooThink_20 彻底解耦
#
# 用途: SSO 联调目标自持（承 docs/plans/module-local-odoo20-ce.md）。
#   启动: docker compose -f docker-compose.odoo.yml up -d
#   访问: http://localhost:8069 （首次无库→落 /web/database/selector 建库向导）
#   回收: docker compose -f docker-compose.odoo.yml down -v   （用完即焚·零足迹）
#
# 隔离纪律（防与 OdooThink_20 / 本仓应用 dev 栈交集）:
#   - 端口: 宿主 8069（OdooThink 仅内部占 8069/tcp 未对外·本栈独占宿主 8069·已核实空闲）
#   - 网络: 专属 odoo-net（不与 nestjs-network-dev 互通）
#   - 卷:   专属 odoo-db-data / odoo-web-data（绝不触碰 postgres-data-dev / OdooThink 卷）
#   - 口令: dev 占位口令·非真实凭证·不入 .env（Odoo DB 口令仅在本编排内闭环）
#
# 插件落点: ./odoo/saas-addons → 容器 /mnt/extra-addons（官方镜像默认识别·可 -i 安装）。

services:
  odoo:
    container_name: odoo20-ce
    image: odoo:20
    restart: unless-stopped
    depends_on:
      odoo-db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./odoo/saas-addons:/mnt/extra-addons
    environment:
      - HOST=odoo-db
      - PORT=5432
      - USER=odoo
      - PASSWORD=odoo
    networks:
      - odoo-net
    healthcheck:
      # 官方 odoo 镜像内含 python3（无 curl/wget·探针只用镜像内实存能力·tooling §4.10）；
      # 首启建库耗时·给足 start_period。
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1',8069),3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  odoo-db:
    container_name: odoo20-ce-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      - odoo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  odoo-net:
    driver: bridge

volumes:
  odoo-web-data:
    driver: local
  odoo-db-data:
    driver: local
