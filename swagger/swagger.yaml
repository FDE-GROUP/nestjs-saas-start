          description: Missing or invalid session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Not a member of the target tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Set the active tenant of the current session (tenant activation)
      tags: *ref_13
  /api/v1/subscriptions/current:
    get:
      operationId: SubscriptionsController_getCurrent_v1
      parameters: []
      responses:
        '200':
          description: Effective subscription snapshot for the active organization.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionResponse'
        '403':
          description: No active organization context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: >-
        Current organization subscription: plan, seat quota, usage, customer
        mapping
      tags: &ref_14
        - subscriptions
  /api/v1/subscriptions:
    post:
      operationId: SubscriptionsController_create_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan:
                  type: string
                  enum:
                    - free
                    - pro
                    - enterprise
                customerEmail:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                seatsLimit:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                storageQuota:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                apiQuota:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
              required:
                - plan
                - customerEmail
              additionalProperties: false
      responses:
        '201':
          description: Subscription created; returns the updated snapshot.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SubscriptionResponse'
        '403':
          description: Not allowed to update the organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: No payment provider configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: >-
        Provision/upgrade the organization subscription (creates the provider
        customer)
      tags: *ref_14
  /api/v1/storage/upload:
    post:
      operationId: StorageController_uploadFile_v1
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: File to upload
      responses:
        '201':
          description: Uploaded file result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/FileUploadResultDto'
      summary: Upload a single file
      tags: &ref_15
        - storage
  /api/v1/storage/{key}:
    delete:
      operationId: StorageController_deleteFile_v1
      parameters:
        - name: key
          required: true
          in: path
          description: Unique identifier of the file
          schema:
            type: string
      responses:
        '200':
          description: Delete result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StorageDeleteResponse'
      summary: Delete a file
      tags: *ref_15
  /api/v1/storage/{key}/url:
    get:
      operationId: StorageController_getFileUrl_v1
      parameters:
        - name: key
          required: true
          in: path
          description: Unique identifier of the file
          schema:
            type: string
        - name: expiresIn
          required: false
          in: query
          description: Expiration time for URL (seconds)
          schema:
            type: number
      responses:
        '200':
          description: Signed URL payload.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/StorageUrlResponse'
      summary: Get a signed URL for a file
      tags: *ref_15
  /api/v1/payment/test:
    get:
      operationId: PaymentController_test_v1
      parameters: []
      responses:
        '200':
          description: Current provider selection and available channels
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaymentStatusResponse'
      summary: Payment integration status
      tags: &ref_16
        - payment
  /api/v1/payment/customers:
    post:
      operationId: PaymentController_createCustomer_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                name:
                  type: string
                  maxLength: 200
                metadata:
                  type: object
                  additionalProperties:
                    type: string
              required:
                - email
              additionalProperties: false
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaymentCustomerRefResponse'
      summary: Create a payment customer
      tags: *ref_16
  /api/v1/payment/checkouts:
    post:
      operationId: PaymentController_createCheckout_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  minimum: 1
                currency:
                  type: string
                  minLength: 1
                  maxLength: 10
                description:
                  type: string
                  maxLength: 20000
                metadata:
                  type: object
                  additionalProperties:
                    type: string
              required:
                - amount
                - currency
              additionalProperties: false
      responses:
        '201':
          description: Checkout created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaymentCheckoutRefResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Create a checkout (payment intent)
      tags: *ref_16
  /api/v1/payment/checkouts/{id}:
    get:
      operationId: PaymentController_retrieveCheckout_v1
      parameters:
        - name: id
          required: true
          in: path
          description: Checkout (payment intent) ID
          schema:
            type: string
      responses:
        '200':
          description: Checkout retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaymentCheckoutRefResponse'
        '404':
          description: Checkout not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Retrieve a checkout
      tags: *ref_16
  /api/v1/payment/refunds:
    post:
      operationId: PaymentController_refund_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checkoutId:
                  type: string
                  minLength: 1
                  maxLength: 128
                amount:
                  type: number
                  minimum: 1
                reason:
                  type: string
                  maxLength: 20000
              required:
                - checkoutId
              additionalProperties: false
      responses:
        '201':
          description: Refund created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PaymentRefundRefResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Refund a checkout
      tags: *ref_16
  /api/v1/payment/webhooks:
    post:
      operationId: PaymentController_handleWebhook_v1
      parameters:
        - name: stripe-signature
          required: true
          in: header
          description: Payment provider webhook signature
          schema:
            type: string
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WebhookAckResponse'
        '400':
          description: Invalid webhook signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Handle payment webhook events
      tags: *ref_16
info:
  title: NestJS SaaS Start API
  description: NestJS SaaS Start API documentation
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ApiEnvelope:
      type: object
      properties:
        statusCode:
          type: number
          description: HTTP 状态码回显（响应体字段，非状态码本身）。
        message:
          type: string
          description: 人面可读消息（成功面恒 "Success"）。
        data:
          type: object
          description: 业务载荷；具体形状见 allOf 第二项的 $ref。
          additionalProperties: true
      required:
        - statusCode
        - message
        - data
    ApiErrorDetail:
      type: object
      properties:
        path:
          type: string
          description: 字段路径（校验失败 = property；业务失败可缺省）。
        code:
          type: string
          description: 细分机器码（业务子错误给；校验面留空）。
        message:
          type: string
          description: 人面可读（随 i18n 译文）。
      required:
        - message
    ApiErrorResponse:
      type: object
      properties:
        statusCode:
          type: number
          description: HTTP 状态码。
        message:
          description: 人面可读消息；校验失败时为逐字段消息数组。
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
          description: HTTP 类别名（如 "Not Found"）。
        timestamp:
          type: string
          format: date-time
          description: 服务端时刻 ISO 串。
        path:
          type: string
          description: 请求路径。
        requestId:
          type: string
          description: 请求关联 id（与 x-request-id 头、日志、领域事件 correlationId 同源）。
        errorCode:
          type: string
          description: >-
            业务错误码（`NAMESPACE:NAME` 冒号文法·单源 = @core ERROR_CODES，前端据 code 分支、据
            message 展示）。
        errors:
          description: 字段级结构化明细。
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorDetail'
      required:
        - statusCode
        - message
        - error
        - timestamp
        - path
        - requestId
    TenantRoleViewResponse:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7。
        key:
          type: string
          description: 角色 key（租户内唯一）。
        name:
          type: string
          description: 人面可读名。
        isSystem:
          type: boolean
          description: 系统内置角色（不可改名/删除）。
      required:
        - id
        - key
        - name
        - isSystem
    TenantRoleGrantViewResponse:
      type: object
      properties:
        subject:
          type: string
          enum:
            - Organization
            - Member
            - Invitation
            - Workspace
            - Role
            - RoleGrant
          description: 授权主体词汇。
        action:
          type: string
          enum:
            - create
            - read
            - update
            - delete
            - cancel
          description: 动作词汇。
        conditions:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: CASL 条件（白名单字段）；null = 无约束。
        organizationId:
          type:
            - string
            - 'null'
          description: 组织收窄 scope；null = 租级通配行（跨 org 生效），字符串 = 仅该 org 生效。
      required:
        - subject
        - action
        - conditions
        - organizationId
    PlatformTenantRowResponse:
      type: object
      properties:
        tenantId:
          type: string
          description: tenant 主键。
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: &ref_17
            - pending_approval
            - active
            - suspended
            - deleted
          description: 准入态（无记录视同 active）。
        organizationCount:
          type: number
          description: 名下组织数量（一租多组织可见）。
        createdAt:
          format: date-time
          type: string
      required:
        - tenantId
        - name
        - slug
        - status
        - organizationCount
        - createdAt
    PlatformTenantPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformTenantRowResponse'
        total:
          type: number
          description: 全量行数。
        limit:
          type: number
          description: 回显页宽。
        offset:
          type: number
          description: 回显偏移。
      required:
        - items
        - total
        - limit
        - offset
    PlatformTenantOrganizationResponse:
      type: object
      properties:
        organizationId:
          type: string
          description: organization 主键。
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: *ref_17
          description: 组织自有态。
        odooCompanyId:
          type:
            - object
            - 'null'
          description: 绑定的 Odoo 公司 id（未绑定为 null）。
        odooBindingStatus:
          type:
            - object
            - 'null'
          description: Odoo 绑定态（未绑定为 null）。
        odooCompanyName:
          type:
            - object
            - 'null'
          description: Odoo 公司名快照（未绑定为 null）。
      required:
        - organizationId
        - name
        - slug
        - status
        - odooCompanyId
        - odooBindingStatus
        - odooCompanyName
    PlatformTenantDetailResponse:
      type: object
      properties:
        tenantId:
          type: string
          description: tenant 主键。
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: *ref_17
          description: 准入态（无记录视同 active）。
        createdAt:
          format: date-time
          type: string
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/PlatformTenantOrganizationResponse'
      required:
        - tenantId
        - name
        - slug
        - status
        - createdAt
        - organizations
    PlatformOrganizationDrillRowResponse:
      type: object
      properties:
        organizationId:
          type: string
          description: organization 主键。
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: *ref_17
          description: 组织态（无记录视同 active）。
        createdAt:
          format: date-time
          type: string
      required:
        - organizationId
        - name
        - slug
        - status
        - createdAt
    OrganizationDiagnosticsResponse:
      type: object
      properties:
        organization:
          description: 组织下钻行。
          allOf:
            - $ref: '#/components/schemas/PlatformOrganizationDrillRowResponse'
        memberCount:
          type: number
          description: 成员数。
        invitationCount:
          type: number
          description: 待处理邀请数。
        workspaceCount:
          type: number
          description: 工作区数。
        postCount:
          type: number
          description: 帖子数。
      required:
        - organization
        - memberCount
        - invitationCount
        - workspaceCount
        - postCount
    TenantGovernanceResultResponse:
      type: object
      properties:
        tenantId:
          type: string
          description: 目标 tenant 主键。
        status:
          type: string
          enum: *ref_17
          description: 迁移后的准入态。
      required:
        - tenantId
        - status
    TenantHardDeleteResultResponse:
      type: object
      properties:
        tenantId:
          type: string
          description: 被硬删的 tenant 主键。
        purgedOrgs:
          type: number
          description: 本次连带消灭的组织行数（一租多组织）。
        purgedEvents:
          type: number
          description: 本次清除的 lifecycle 事件数（供审计核对）。
      required:
        - tenantId
        - purgedOrgs
        - purgedEvents
    TenantOrgVisibilityResultResponse:
      type: object
      properties:
        tenantId:
          type: string
          description: 目标 tenant 主键。
        orgVisibility:
          type: string
          enum:
            - shared
            - isolated
          description: 设置后的租内跨组织可见性策略（shared 互见·isolated 互不可见）。
      required:
        - tenantId
        - orgVisibility
    PlatformUserRowResponse:
      type: object
      properties:
        userId:
          type: string
          description: 用户主键。
        name:
          type: string
        email:
          type: string
        status:
          type: string
          enum: *ref_17
          description: 治理状态（无记录视同 active）。
        createdAt:
          format: date-time
          type: string
      required:
        - userId
        - name
        - email
        - status
        - createdAt
    PlatformUserPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlatformUserRowResponse'
        total:
          type: number
          description: 全量行数。
        limit:
          type: number
          description: 回显页宽。
        offset:
          type: number
          description: 回显偏移。
      required:
        - items
        - total
        - limit
        - offset
    UserGovernanceResultResponse:
      type: object
      properties:
        userId:
          type: string
          description: 用户主键。
        status:
          type: string
          enum: *ref_17
          description: 迁移后的新状态。
      required:
        - userId
        - status
    PostResponse:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7。
        title:
          type: string
        content:
          type:
            - string
            - 'null'
        published:
          type: boolean
        organizationId:
          type: string
          description: 所属组织（ALS 盖章，body 不接受）。
        workspaceId:
          type:
            - string
            - 'null'
          description: 所属工作区；NULL = 未分区。
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - title
        - content
        - published
        - organizationId
        - workspaceId
        - createdAt
        - updatedAt
    PostCursorPageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostResponse'
        hasMore:
          type: boolean
          description: 是否还有下一页。
        nextCursor:
          type: string
          description: 不透明游标（hasMore=false 时缺省）。
      required:
        - items
        - hasMore
    WorkspaceResponse:
      type: object
      properties:
        id:
          type: string
          description: UUIDv7。
        name:
          type: string
        slug:
          type: string
        organizationId:
          type: string
          description: 所属组织（仓储盖章）。
        ownerId:
          type:
            - string
            - 'null'
          description: 实例属主；NULL/缺省 = 不属任何人（owner-column 片语义）。
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - slug
        - organizationId
        - createdAt
        - updatedAt
    WorkspacePageResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceResponse'
        total:
          type: number
          description: 全量行数。
        limit:
          type: number
          description: 回显页宽。
        offset:
          type: number
          description: 回显偏移。
      required:
        - items
        - total
        - limit
        - offset
    OrganizationApplicationResponse:
      type: object
      properties:
        organizationId:
          type: string
          description: organization 主键。
        status:
          type: string
          enum: &ref_18
            - pending_approval
            - active
            - suspended
            - deleted
          description: 生命周期状态。
      required:
        - organizationId
        - status
    OrganizationOdooBindingResponse:
      type: object
      properties:
        organizationId:
          type: string
          description: organization 主键。
        odooCompanyId:
          type: number
          description: 绑定的 Odoo 公司 id（res.company 主键·跨库弱引用）。
        odooBindingStatus:
          type: string
          enum:
            - pending
            - provisioning
            - ready
            - failed
          description: 绑定生命周期态。
        odooCompanyName:
          type:
            - string
            - 'null'
          description: 公司名快照（denormalize）。
        odooBoundAt:
          format: date-time
          type:
            - string
            - 'null'
          description: 绑定确立时间。
      required:
        - organizationId
        - odooCompanyId
        - odooBindingStatus
        - odooCompanyName
        - odooBoundAt
    OrganizationOdooAvailabilityResponse:
      type: object
      properties:
        available:
          type: boolean
          description: Odoo 能力当前对该租户是否可用（canUseOdoo 单源裁决）。
        odooBindingStatus:
          type:
            - string
            - 'null'
          enum:
            - pending
            - provisioning
            - ready
            - failed
            - null
          description: 绑定生命周期态（null=未绑定/无活跃租户）。
        odooCompanyId:
          type:
            - number
            - 'null'
          description: 绑定的 Odoo 公司 id（res.company 主键·无绑定即 null）。
      required:
        - available
        - odooBindingStatus
        - odooCompanyId
    TenantDirectoryOrganizationResponse:
      type: object
      properties:
        organizationId:
          type: string
          description: 组织主键（二级轴·绑一家 Odoo 公司）。
        name:
          type: string
          description: 组织名称。
