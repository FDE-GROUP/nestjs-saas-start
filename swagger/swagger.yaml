info:
  title: NestJS SaaS Start API
  description: NestJS SaaS Start API documentation
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ApiEnvelope:
      type: object
      properties:
        statusCode:
          type: number
          description: HTTP 状态码回显（响应体字段，非状态码本身）。
        message:
          type: string
          description: 人面可读消息（成功面恒 "Success"）。
        data:
          type: object
          description: 业务载荷；具体形状见 allOf 第二项的 $ref。
          additionalProperties: true
      required:
        - statusCode
        - message
        - data
    ApiErrorDetail:
      type: object
      properties:
        path:
          type: string
          description: 字段路径（校验失败 = property；业务失败可缺省）。
        code:
          type: string
          description: 细分机器码（业务子错误给；校验面留空）。
        message:
          type: string
          description: 人面可读（随 i18n 译文）。
      required:
        - message
    ApiErrorResponse:
      type: object
      properties:
        statusCode:
          type: number
          description: HTTP 状态码。
        message:
          description: 人面可读消息；校验失败时为逐字段消息数组。
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
          description: HTTP 类别名（如 "Not Found"）。
        timestamp:
          type: string
          format: date-time
          description: 服务端时刻 ISO 串。
        path:
          type: string
          description: 请求路径。
        requestId:
          type: string
          description: 请求关联 id（与 x-request-id 头、日志、领域事件 correlationId 同源）。
        errorCode:
          type: string
          description: >-
            业务错误码（`NAMESPACE:NAME` 冒号文法·单源 = @core ERROR_CODES，前端据 code 分支、据
            message 展示）。
        errors:
          description: 字段级结构化明细。
          type: array
          items:
            $ref: '#/components/schemas/ApiErrorDetail'
      required:
        - statusCode
        - message
        - error
        - timestamp
        - path
        - requestId
    FileUploadResultDto:
      type: object
      properties:
        key:
          type: string
          description: File unique identifier
        url:
          type: string
          description: File access URL
        etag:
          type: string
          description: File ETag value
        size:
          type: number
          description: File size (bytes)
        mimetype:
          type: string
          description: File MIME type
        originalname:
          type: string
          description: Original filename
      required:
        - key
        - url
        - size
        - mimetype
        - originalname
    StorageDeleteResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 删除是否成功。
      required:
        - success
    StorageUrlResponse:
      type: object
      properties:
        url:
          type: string
          description: 签名访问 URL。
      required:
        - url
