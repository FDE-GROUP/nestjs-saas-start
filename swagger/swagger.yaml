openapi: 3.1.0
paths:
  /api/v1/health:
    get:
      operationId: HealthController_check_v1
      parameters: []
      responses:
        '200':
          description: |-
            Service is alive（透传面·形参真相源 = @nestjs/terminus HealthCheckResult）

            The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                    example: ok
                  info:
                    type:
                      - object
                      - 'null'
                    example: &ref_0
                      database:
                        status: up
                        responseTime: 12
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                  error:
                    type:
                      - object
                      - 'null'
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                  details:
                    type: object
                    example: *ref_0
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
        '503':
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                      - shutting_down
                    example: error
                  info:
                    type:
                      - object
                      - 'null'
                    example:
                      database: &ref_1
                        status: up
                        responseTime: 12
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                  error:
                    type:
                      - object
                      - 'null'
                    example:
                      redis: &ref_2
                        status: down
                        message: Could not connect
                        responseTime: 3005
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                  details:
                    type: object
                    example:
                      database: *ref_1
                      redis: *ref_2
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
      summary: Liveness probe (ping-only, no dependency checks)
      tags:
        - Health
  /api/v1/oauth2/authorize:
    get:
      operationId: OauthSsoController_authorize_v1
      parameters:
        - name: client_id
          required: true
          in: query
          schema:
            type: string
            minLength: 1
        - name: redirect_uri
          required: true
          in: query
          schema:
            type: string
            minLength: 1
        - name: response_type
          required: true
          in: query
          schema:
            type: string
            enum:
              - token
        - name: scope
          required: false
          in: query
          schema:
            type: string
        - name: state
          required: false
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to whitelisted redirect_uri#access_token=…
        '400':
          description: Unregistered client_id or redirect_uri not in whitelist.
        '401':
          description: No authenticated session (global session wall).
        '403':
          description: >-
            Odoo not available for the active organization (canUseOdoo
            fail-closed).
      summary: >-
        OAuth2 implicit-flow authorization endpoint (this repo acts as Odoo
        auth_oauth OP)
      tags: &ref_3
        - oauth-sso
  /api/v1/oauth2/userinfo:
    get:
      operationId: OauthSsoController_userinfo_v1
      parameters: []
      responses:
        '200':
          description: Raw OIDC claims { sub, email, name }.
        '401':
          description: Missing/invalid token or audience not authorized.
        '403':
          description: Email not verified.
      summary: >-
        OIDC userinfo (Bearer access token; returns raw JSON, not the API
        envelope)
      tags: *ref_3
  /api/v1/organizations/roles:
    get:
      operationId: AuthorizationAdminController_listRoles_v1
      parameters: []
      responses:
        '200':
          description: Role views.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TenantRoleViewResponse'
        '403':
          description: CASL deny (no Role read).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: List roles of the active organization (system + custom)
      tags: &ref_4
        - organizations
    post:
      operationId: AuthorizationAdminController_createRole_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  minLength: 1
                  maxLength: 128
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
              required:
                - key
                - name
              additionalProperties: false
      responses:
        '200':
          description: Created role view.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantRoleViewResponse'
        '400':
          description: Invalid/reserved role key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Role key already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Create a custom role (owner/admin)
      tags: *ref_4
  /api/v1/organizations/roles/rename:
    post:
      operationId: AuthorizationAdminController_renameRole_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  minLength: 1
                  maxLength: 128
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
              required:
                - key
                - name
              additionalProperties: false
      responses:
        '200':
          description: Renamed.
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: System role protected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Rename a custom role (system roles protected)
      tags: *ref_4
  /api/v1/organizations/roles/delete:
    post:
      operationId: AuthorizationAdminController_deleteRole_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - key
              additionalProperties: false
      responses:
        '200':
          description: Deleted.
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: System role protected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Delete a custom role (grants cascade; system roles protected)
      tags: *ref_4
  /api/v1/organizations/roles/grants:
    get:
      operationId: AuthorizationAdminController_listGrants_v1
      parameters:
        - name: roleKey
          required: true
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Grant views (subject/action/conditions).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TenantRoleGrantViewResponse'
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: List grant rows of a role (echo checked state)
      tags: *ref_4
    post:
      operationId: AuthorizationAdminController_grant_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleKey:
                  type: string
                  minLength: 1
                  maxLength: 128
                subject:
                  type: string
                  enum:
                    - Organization
                    - Member
                    - Invitation
                    - Workspace
                    - Role
                    - RoleGrant
                action:
                  type: string
                  enum:
                    - create
                    - read
                    - update
                    - delete
                    - cancel
                conditions:
                  type: object
                  additionalProperties: {}
                organizationId:
                  type:
                    - string
                    - 'null'
                  minLength: 1
              required:
                - roleKey
                - subject
                - action
              additionalProperties: false
      responses:
        '200':
          description: Granted.
        '400':
          description: Invalid conditions (whitelist-only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Role not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Duplicate grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Grant a permission cell to a role (multi-condition rows = OR union)
      tags: *ref_4
  /api/v1/organizations/roles/grants/revoke:
    post:
      operationId: AuthorizationAdminController_revoke_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleKey:
                  type: string
                  minLength: 1
                  maxLength: 128
                subject:
                  type: string
                  enum:
                    - Organization
                    - Member
                    - Invitation
                    - Workspace
                    - Role
                    - RoleGrant
                action:
                  type: string
                  enum:
                    - create
                    - read
                    - update
                    - delete
                    - cancel
                conditions:
                  type: object
                  additionalProperties: {}
                organizationId:
                  type:
                    - string
                    - 'null'
                  minLength: 1
              required:
                - roleKey
                - subject
                - action
              additionalProperties: false
      responses:
        '200':
          description: Revoked.
        '404':
          description: Role or matching grant not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Revoke a grant (conditions null = whole-subject row; object = exact row)
      tags: *ref_4
