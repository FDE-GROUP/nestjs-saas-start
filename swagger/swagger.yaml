info:
  title: NestJS SaaS Start
  description: NestJS template with best practices
  version: 1.0.0
servers:
  - url: /api/v1.0
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: health.check
      summary: Liveness probe (ping-only)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  info:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  error:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  details:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                required:
                  - status
                  - details
                additionalProperties: false
  /posts:
    get:
      operationId: posts.list
      summary: List posts in the active organization (cursor-paginated)
      parameters:
        - in: query
          name: limit
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
          allowEmptyValue: true
          allowReserved: true
        - in: query
          name: cursor
          schema:
            type: string
            maxLength: 512
            pattern: ^[A-Za-z0-9_-]+$
          allowEmptyValue: true
          allowReserved: true
        - in: query
          name: organizationId
          schema:
            type: string
            maxLength: 128
          allowEmptyValue: true
          allowReserved: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        content:
                          type:
                            - string
                            - 'null'
                        published:
                          type: boolean
                        organizationId:
                          type: string
                        workspaceId:
                          type:
                            - string
                            - 'null'
                        createdAt: {}
                        updatedAt: {}
                      required:
                        - id
                        - title
                        - content
                        - published
                        - organizationId
                        - workspaceId
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                  hasMore:
                    type: boolean
                  nextCursor:
                    type: string
                required:
                  - items
                  - hasMore
                additionalProperties: false
    post:
      operationId: posts.create
      summary: Create a post in the active organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                content:
                  type: string
                  maxLength: 20000
                published:
                  type: boolean
              required:
                - title
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  content:
                    type:
                      - string
                      - 'null'
                  published:
                    type: boolean
                  organizationId:
                    type: string
                  workspaceId:
                    type:
                      - string
                      - 'null'
                  createdAt: {}
                  updatedAt: {}
                required:
                  - id
                  - title
                  - content
                  - published
                  - organizationId
                  - workspaceId
                  - createdAt
                  - updatedAt
                additionalProperties: false
  /users/me/data-export:
    get:
      operationId: users.exportData
      summary: 'PIPL right-to-access: export current user personal data (C1 · FR-7)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      handle:
                        type: string
                      role:
                        type: string
                      emailVerified:
                        type: boolean
                      image:
                        type:
                          - string
                          - 'null'
                      firstName:
                        type:
                          - string
                          - 'null'
                      lastName:
                        type:
                          - string
                          - 'null'
                      createdAt: {}
                      updatedAt: {}
                    required:
                      - id
                      - email
                      - name
                      - handle
                      - role
                      - emailVerified
                      - image
                      - firstName
                      - lastName
                      - createdAt
                      - updatedAt
                    additionalProperties: false
                  accounts:
                    type: array
                    items: {}
                  sessions:
                    type: array
                    items: {}
                  consents:
                    type: array
                    items: {}
                required:
                  - user
                  - accounts
                  - sessions
                  - consents
                additionalProperties: false
  /users/me:
    delete:
      operationId: users.remove
      summary: 'PIPL right-to-erase: hard-delete current user (C1 · FR-7)'
      responses:
        '204':
          description: OK
          content: {}
  /workspaces:
    get:
      operationId: workspaces.list
      summary: List workspaces in the active organization
      parameters:
        - in: query
          name: limit
          schema:
            default: 20
            type: integer
            minimum: 1
            maximum: 100
          allowEmptyValue: true
          allowReserved: true
        - in: query
          name: offset
          schema:
            default: 0
            type: integer
            minimum: 0
            maximum: 9007199254740991
          allowEmptyValue: true
          allowReserved: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        slug:
                          type: string
                        organizationId:
                          type: string
                        ownerId:
                          type:
                            - string
                            - 'null'
                        createdAt: {}
                        updatedAt: {}
                      required:
                        - id
                        - name
                        - slug
                        - organizationId
                        - createdAt
                        - updatedAt
                      additionalProperties: false
                  total:
                    type: number
                  limit:
                    type: number
                  offset:
                    type: number
                required:
                  - items
                  - total
                  - limit
                  - offset
                additionalProperties: false
    post:
      operationId: workspaces.create
      summary: Create a workspace (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                slug:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$
              required:
                - name
                - slug
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
                  organizationId:
                    type: string
                  ownerId:
                    type:
                      - string
                      - 'null'
                  createdAt: {}
                  updatedAt: {}
                required:
                  - id
                  - name
                  - slug
                  - organizationId
                  - createdAt
                  - updatedAt
                additionalProperties: false
  /workspaces/:id:
    patch:
      operationId: workspaces.update
      summary: Update a workspace (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                slug:
                  type: string
                  maxLength: 128
                  pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$
                id:
                  type: string
              required:
                - id
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  slug:
                    type: string
                  organizationId:
                    type: string
                  ownerId:
                    type:
                      - string
                      - 'null'
                  createdAt: {}
                  updatedAt: {}
                required:
                  - id
                  - name
                  - slug
                  - organizationId
                  - createdAt
                  - updatedAt
                additionalProperties: false
    delete:
      operationId: workspaces.remove
      summary: Delete a workspace (owner/admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
              additionalProperties: false
      responses:
        '204':
          description: OK
          content: {}
  /payment/test:
    get:
      operationId: payment.test
      summary: Payment integration status
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: ok
                  selected:
                    type: string
                    enum:
                      - stripe
                      - alipay
                      - wechat_pay
                  available:
                    type: array
                    items:
                      type: string
                      enum:
                        - stripe
                        - alipay
                        - wechat_pay
                required:
                  - status
                  - selected
                  - available
                additionalProperties: false
  /payment/customers:
    post:
      operationId: payment.createCustomer
      summary: Create a payment customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                name:
                  type: string
                  maxLength: 200
                metadata:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
              required:
                - email
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  providerId:
                    type: string
                    enum:
                      - stripe
                      - alipay
                      - wechat_pay
                  email:
                    type: string
                  raw: {}
                required:
                  - id
                  - providerId
                  - email
                  - raw
                additionalProperties: false
  /payment/checkouts:
    post:
      operationId: payment.createCheckout
      summary: Create a checkout (payment intent)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  minimum: 1
                currency:
                  type: string
                  minLength: 1
                  maxLength: 10
                description:
                  type: string
                  maxLength: 20000
                metadata:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: string
              required:
                - amount
                - currency
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  providerId:
                    type: string
                    enum:
                      - stripe
                      - alipay
                      - wechat_pay
                  status:
                    type: string
                  clientSecret:
                    type: string
                  raw: {}
                required:
                  - id
                  - providerId
                  - raw
                additionalProperties: false
  /payment/checkouts/:id:
    get:
      operationId: payment.retrieveCheckout
      summary: Retrieve a checkout
      parameters:
        - in: query
          name: id
          schema:
            type: string
            minLength: 1
            maxLength: 128
          allowEmptyValue: true
          allowReserved: true
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  providerId:
                    type: string
                    enum:
                      - stripe
                      - alipay
                      - wechat_pay
                  status:
                    type: string
                  clientSecret:
                    type: string
                  raw: {}
                required:
                  - id
                  - providerId
                  - raw
                additionalProperties: false
  /payment/refunds:
    post:
      operationId: payment.refund
      summary: Refund a checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checkoutId:
                  type: string
                  minLength: 1
                  maxLength: 128
                amount:
                  type: number
                  minimum: 1
                reason:
                  type: string
                  maxLength: 20000
              required:
                - checkoutId
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  providerId:
                    type: string
                    enum:
                      - stripe
                      - alipay
                      - wechat_pay
                  status:
                    type: string
                  amount:
                    type: number
                  raw: {}
                required:
                  - id
                  - providerId
                  - raw
                additionalProperties: false
  /storage/:key:
    delete:
      operationId: storage.remove
      summary: Delete a file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
              required:
                - key
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                  - success
                additionalProperties: false
  /storage/:key/url:
    get:
      operationId: storage.url
      summary: Get a signed URL for a file
      parameters:
        - in: query
          name: key
          schema:
            type: string
          allowEmptyValue: true
          allowReserved: true
          required: true
        - in: query
          name: expiresIn
          schema:
            type: number
          allowEmptyValue: true
          allowReserved: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                required:
                  - url
                additionalProperties: false
  /subscriptions/current:
    get:
      operationId: subscriptions.current
      summary: >-
        Current organization subscription: plan, seat quota, usage, customer
        mapping
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasSubscription:
                    type: boolean
                  plan:
                    type: string
                  seatsLimit:
                    type: number
                  used:
                    type: number
                  remaining:
                    type: number
                  providerCustomerId:
                    type:
                      - string
                      - 'null'
                required:
                  - hasSubscription
                  - plan
                  - seatsLimit
                  - used
                  - remaining
                  - providerCustomerId
                additionalProperties: false
  /subscriptions:
    post:
      operationId: subscriptions.create
      summary: >-
        Provision/upgrade the organization subscription (creates the provider
        customer)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan:
                  type: string
                  enum:
                    - free
                    - pro
                    - enterprise
                customerEmail:
                  type: string
                  maxLength: 254
                  format: email
                  pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                seatsLimit:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
                storageQuota:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                apiQuota:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
              required:
                - plan
                - customerEmail
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasSubscription:
                    type: boolean
                  plan:
                    type: string
                  seatsLimit:
                    type: number
                  used:
                    type: number
                  remaining:
                    type: number
                  providerCustomerId:
                    type:
                      - string
                      - 'null'
                required:
                  - hasSubscription
                  - plan
                  - seatsLimit
                  - used
                  - remaining
                  - providerCustomerId
                additionalProperties: false
  /tenants:
    get:
      operationId: tenants.list
      summary: List tenant directory of the current user (tenants → organizations)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenants:
                    type: array
                    items:
                      type: object
                      properties:
                        tenantId:
                          type: string
                        name:
                          type: string
                        slug:
                          type: string
                        status:
                          type: string
                          enum:
                            - pending_approval
                            - active
                            - suspended
                            - deleted
                        organizations:
                          type: array
                          items:
                            type: object
                            properties:
                              organizationId:
                                type: string
                              name:
                                type: string
                              slug:
                                type: string
                            required:
                              - organizationId
                              - name
                              - slug
                            additionalProperties: false
                      required:
                        - tenantId
                        - name
                        - slug
                        - status
                        - organizations
                      additionalProperties: false
                required:
                  - tenants
                additionalProperties: false
  /tenants/active:
    put:
      operationId: tenants.setActive
      summary: Set the active tenant of the current session (tenant activation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tenantId:
                  type: string
                  minLength: 1
                  maxLength: 64
              required:
                - tenantId
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenantId:
                    type: string
                required:
                  - tenantId
                additionalProperties: false
  /organizations:
    get:
      operationId: organizations.list
      summary: List organizations the current user belongs to (personal channel)
      responses:
        '200':
          description: OK
          content: {}
  /organizations/active:
    post:
      operationId: organizations.setActive
      summary: Switch the session's active organization (must be a member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationId:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - organizationId
              additionalProperties: false
      responses:
        '200':
          description: OK
          content: {}
  /organizations/members/leave:
    post:
      operationId: organizations.leave
      summary: Leave the active tenant (self-service · last-owner cannot leave)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationId:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - organizationId
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required:
                  - ok
                additionalProperties: false
  /organizations/invitations/accept:
    post:
      operationId: organizations.acceptInvitation
      summary: Accept an invitation addressed to the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invitationId:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - invitationId
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenantId:
                    type: string
                  roleKey:
                    type: string
                required:
                  - tenantId
                  - roleKey
                additionalProperties: false
  /organizations/invitations/reject:
    post:
      operationId: organizations.rejectInvitation
      summary: Reject an invitation addressed to the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invitationId:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - invitationId
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required:
                  - ok
                additionalProperties: false
  /organizations/invitations/mine:
    get:
      operationId: organizations.listMyInvitations
      summary: List pending invitations addressed to the current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    tenantId:
                      type: string
                    email:
                      type: string
                    roleKey:
                      type: string
                    invitorId:
                      type:
                        - string
                        - 'null'
                    status:
                      type: string
                    expiresAt:
                      anyOf:
                        - {}
                        - type: 'null'
                    createdAt: {}
                  required:
                    - id
                    - tenantId
                    - email
                    - roleKey
                    - invitorId
                    - status
                    - expiresAt
                    - createdAt
                  additionalProperties: false
  /organizations/odoo/availability:
    get:
      operationId: organizations.odooAvailability
      summary: >-
        Read the active organization Odoo availability for the apps panel
        (personal channel)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  odooBindingStatus:
                    anyOf:
                      - type: string
                        enum:
                          - pending
                          - provisioning
                          - ready
                          - failed
                      - type: 'null'
                  odooCompanyId:
                    anyOf:
                      - type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      - type: 'null'
                required:
                  - available
                  - odooBindingStatus
                  - odooCompanyId
                additionalProperties: false
  /organizations/applications:
    post:
      operationId: organizations.applications.apply
      summary: Apply to create an organization (user-level · lands pending_approval)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                slug:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$
              required:
                - name
                - slug
              additionalProperties: false
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizationId:
                    type: string
                  status:
                    type: string
                    enum:
                      - pending_approval
                      - active
                      - suspended
                      - deleted
                required:
                  - organizationId
                  - status
                additionalProperties: false
  /organizations/applications/:id/approve:
    post:
      operationId: organizations.applications.approve
      summary: Approve a pending organization (platform operator · pending → active)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
              additionalProperties: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizationId:
                    type: string
                  status:
                    type: string
                    enum:
                      - pending_approval
                      - active
                      - suspended
                      - deleted
                required:
                  - organizationId
                  - status
                additionalProperties: false
  /organizations/applications/:id/reject:
    post:
      operationId: organizations.applications.reject
      summary: Reject a pending organization (platform operator · hard-delete)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
              additionalProperties: false
      responses:
        '204':
          description: OK
          content: {}
  /organizations/:id/odoo-binding:
    post:
      operationId: organizations.applications.bindOdoo
