  /api/v1/oauth2/authorize:
    get:
      operationId: OauthSsoController_authorize_v1
      parameters:
        - name: client_id
          required: true
          in: query
          schema:
            type: string
            minLength: 1
        - name: redirect_uri
          required: true
          in: query
          schema:
            type: string
            minLength: 1
        - name: response_type
          required: true
          in: query
          schema:
            type: string
            enum:
              - token
        - name: scope
          required: false
          in: query
          schema:
            type: string
        - name: state
          required: false
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to whitelisted redirect_uri#access_token=…
        '400':
          description: Unregistered client_id or redirect_uri not in whitelist.
        '401':
          description: No authenticated session (global session wall).
        '403':
          description: >-
            Odoo not available for the active organization (canUseOdoo
            fail-closed).
      summary: >-
        OAuth2 implicit-flow authorization endpoint (this repo acts as Odoo
        auth_oauth OP)
      tags: &ref_0
        - oauth-sso
  /api/v1/oauth2/userinfo:
    get:
      operationId: OauthSsoController_userinfo_v1
      parameters: []
      responses:
        '200':
          description: Raw OIDC claims { sub, email, name }.
        '401':
          description: Missing/invalid token or audience not authorized.
        '403':
          description: Email not verified.
      summary: >-
        OIDC userinfo (Bearer access token; returns raw JSON, not the API
        envelope)
      tags: *ref_0
