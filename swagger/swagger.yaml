            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantGovernanceResultResponse'
        '404':
          description: Tenant not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Illegal transition for the current status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: Resume a suspended tenant (suspended → active)
      tags: *ref_5
  /api/v1/platform/tenants/{tenantId}/visibility:
    patch:
      operationId: PlatformTenantsController_setVisibility_v1
      parameters:
        - name: tenantId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orgVisibility:
                  type: string
                  enum:
                    - shared
                    - isolated
              required:
                - orgVisibility
              additionalProperties: false
      responses:
        '200':
          description: Tenant orgVisibility updated (shared=互见 · isolated=租内跨组织互不可见).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantOrgVisibilityResultResponse'
        '404':
          description: Tenant not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: >-
        Set the tenant's intra-tenant organization visibility policy (shared ⇄
        isolated)
      tags: *ref_5
  /api/v1/platform/tenants/{tenantId}/permanent:
    delete:
      operationId: PlatformTenantsController_permanentRemove_v1
      parameters:
        - name: tenantId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: >-
            Tenant rows purged; payload carries purgedOrgs/purgedEvents for
            audit核对.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/TenantHardDeleteResultResponse'
        '404':
          description: Tenant not found (or already hard-deleted · idempotent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Not in deleted terminal state — soft-delete first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
      summary: >-
        Hard-delete a deleted-terminal tenant (irreversible · cascade purge of
